component: corpit-tprm-usecase
title: "Corp IT TPRM Use Case"
description: |
  This use case represents the next CorpAI onboarding effort in the ACP journey, following the active AIMS and ORCC workstreams. The TPRM application initially goes live without ACP or Agent Core, with ACP onboarding planned for the ACP-enabled MVP.

  The D0 scope covers the two-agent application scope, the existing agent-calling-an-LLM pattern, model assignment, release phasing, and the capability exposures that must be addressed before ACP and Agent Core are incorporated.

