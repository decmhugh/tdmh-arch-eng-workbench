notes: |
  This D0 consolidates the US BG strategic direction from the US DCP & Agent overview meeting (July 2026). Key decisions: (1) deploy ACP directly to US DCP, skip internal MVP; (2) design for federated multi-region model from start; (3) DCP infrastructure team owns operations post-launch; (4) consortium engineers provide platform oversight and feature development.

  Critical dependencies: Luminate Control Plane governance primitives (killswitch, HITL, risk_tier) must be LIVE before US go-live. US DCP team assignment by 2026-08-22. ATG approval target: 2026-09-15. Production go-live target: 2026-11-15.

  Next steps: Confirm US DCP team; lock compliance framework; submit ATG; identify pilot agents; schedule training.

  Related: EACPP-913 (Luminate Control Plane governance platform), EACPP-909 (AIMS use case), EACPP-911 (ORCC use case), EACPP-912 (MDx use case)
