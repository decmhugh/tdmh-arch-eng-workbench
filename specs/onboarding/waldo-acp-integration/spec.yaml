notes: |
  This D0 captures Waldo's ACP onboarding strategy from the CTO AI initiative planning session (August 2026). Key insights: (1) Waldo is a mature production platform (50+ MCPs, 500 tools, active incident triage use); (2) agentic roadmap (incident management agents) is urgent and expected Q3 2026; (3) no immediate regulatory urgency identified, but OSFI and governance requirements expected drivers; (4) primary dependency is detailed technical onboarding specification from ACP team.

  Critical decision: position Waldo as enterprise orchestrator pattern for ACP; inform future multi-agent architecture and federated governance.

  Next steps: ACP spec delivery; MCP risk classification; gateway design review; pilot MCP onboarding; agent approval; compliance baseline; Q3 pilot launch; Q4 full production rollout.

  Related: EACPP-914 (US ACP Deployment), EACPP-909 (AIMS), EACPP-911 (ORCC), EACPP-912 (MDx)
