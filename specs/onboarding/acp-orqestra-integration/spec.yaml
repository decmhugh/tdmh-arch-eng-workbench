component: "acp-orqestra-integration"
title: "ACP & orQEstra Integration"
description: "Define the ACP integration path for orQEstra, an orchestration/application platform that needs governed access to models and related ACP services. The discovery scope covers application registration, gateway routing, model/provider choices, policy and credential management, production readiness, monitoring, and user-level cost attribution. Detailed architecture, milestones, and operating responsibilities remain to be confirmed."

