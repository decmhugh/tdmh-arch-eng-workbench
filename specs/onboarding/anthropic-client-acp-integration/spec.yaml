component: anthropic-client-acp-integration
title: Anthropic Client Product & ACP Integration
description: 'Onboard Anthropic client products for Sun Life knowledge work through
  ACP-managed

  centralized inference. The first wave covers Claude Code, Claude Cowork, Claude
  Chat,

  and related Microsoft Office add-ins for teams working with spreadsheets,

  presentations, analysis, and other non-PII knowledge-work content. The immediate
  goal

  is controlled model access and a clear path to usage and cost visibility, not

  production deployment.

  '
