gate_status: "D0-D2 approved 2026-09-08 - design agreed, onboarding of the AI-Ready Data MCP server begins against dev Luminate. D3 active, not signed off. D2 re-verified against Luminate main 284008a19: the catalog path, scope_tokens and the status disable are confirmed. Two controls the earlier draft missed are now DD-9 (requires_delegated_identity, without which the data tier's masking evaluates the gateway rather than the caller) and DD-10 (governance_state, which starts at not_evaluated and moves only through the guarded transition). T10 and T11 carry them."
