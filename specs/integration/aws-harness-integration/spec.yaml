component: aws-harness-integration
title: AWS Harness Integration with Luminate
description: "Product-team spec for the updates the AWS Harness SDK (acp-harness-sdk)\
  \ and its consumers need to work against the Luminate stack: repoint GatewayClient\
  \ to Luminate's OpenAI-compatible gateway under /llm with Bearer-JWT auth (replacing\
  \ x-acp-agent-id), repoint RegistryClient to Luminate's catalog viewsets (/api/v1/catalog/{agents,\
  \ mcp-servers,models}) with the project/scope_tokens/mandatory-tags schema, add\
  \ a Luminate token provider hitting the portal client-credentials endpoint (/api/v1/iam/auth/token,\
  \ Authentik-backed), and drop the cross-account Bedrock assume-role since Luminate's\
  \ gateway invokes Bedrock via its own pod role. Sun Life-specific infrastructure\
  \ \u2014 product-team spec."
