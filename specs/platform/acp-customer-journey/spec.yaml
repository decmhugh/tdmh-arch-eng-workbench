gate_status: "D2 draft. An entry gate before 1.1 checks that the business holds a completed GbyD GenAI Risk Triage Form and a ready MRM MBCT ID - ACP verifies presence and records it, does not approve, and pauses onboarding in the rare case either is missing (DD-19, IP-0). Restructured after review with ACP EA, RA and DA representatives (2026-09-04): Phase 1 is now 1.1-1.9. The pattern-fit ruling moved out of the Enterprise Architect's assessment into a step of its own at 1.2, owned by the Regional Architect (DD-17) - an exact match (1.2a) runs 1.3-1.6 and closes at 1.9, skipping pattern definition and build entirely; a new pattern (1.2b) initiates PIA/ISRA/ATG approval before specification starts, while a long-lead approval may complete during discovery and design but must be confirmed before 1.8 implementation or upstream delivery. A final delivery communication was added at 1.9, the only step contacting the End User during or after delivery (DD-18). RA covers CAN/US/ASIA/SLF/CORP/DBTS; DA covers Security-Incident, Integration, Cloud-Container and Observability. DQ-1 resolved by the 1.2a short path. CG-1 closed - pattern rejection was withdrawn, and the pattern question classifies rather than judges (DD-11). CG-2 resolved (DD-12). CG-3 closed - FDES is not a Phase 1 actor. CG-4 (per-step durations) open, non-blocking. CG-5 closed as an assumption - conditional approval returns to 1.2b-1 for rework, while outright refusal is out of scope and tracked as D0 R-9. DQ-7 open - the First Wave to self-serve transition is undesigned (DD-16). DQ-8 resolved - 1.2b-1 initiates approval, discovery and design may proceed, and ACP confirms approval before 1.8. DQ-9 open - nothing between 1.3 and 1.6 re-tests a wrong 1.2a ruling. At 1.2 the RA rules against two catalogues - integration-patterns for the adoption path, and agent-patterns for the applicable agent shapes and the SUB-E/SUB-I criteria (DD-8). Remaining before sign-off: EU and CT confirmation of their responsibility-model rows; a confirmation record naming every actor (NFR-3); ACP PO readability review; and publication to Confluence with confluence_page recorded (NFR-5)."

