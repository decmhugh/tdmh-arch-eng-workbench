component: acp-customer-journey
title: "ACP Customer Journey (Phase 1) — Intake, Pattern Assessment & Enablement"
description: "The interaction model for ACP intake: who is involved at each step from first contact with a business group through to a use case being specified, its pattern ruled existing-or-new, any new pattern built and verified, and the outcome communicated. Answers two questions that are currently answered differently each time — 'what is the process to be onboarded to ACP' (asked by business groups) and 'what is the process to build ACP capability when a use case does not fit an existing pattern' (asked inside the ACP Product Team). Defines six actors, a numbered hand-off register, a RACI with exactly one accountable party per step, the D0–D4 artefact each step produces, and the three conditional branches: exact match or new pattern required, ruled by the Regional Architect at 1.2; design changes requested or confirmed at 1.6; ACP versus Consortium delivery at 1.8. An exact match takes the short path and skips pattern definition and build entirely. Phase 1 only — steps 1.1 to 1.9, ending at a closing communication and the point a use case is ready to register an agent; registration, runtime and ongoing governance need a follow-on spec."

