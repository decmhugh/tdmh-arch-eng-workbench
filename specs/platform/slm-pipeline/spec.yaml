component: slm-pipeline
title: "Small Local Model (SLM) Pipeline"
description: "Self-hosted open-weight Small Local Models served through ACP. A governed Hugging Face mirror in JFrog Artifactory is the single vetted pull-through source; only models that pass GenAI Risk Triage + Legal review and are registered/approved in the ACP Model Registry may be mirrored, pulled, and served from EKS via the AI Gateway. Phased delivery: an interim dev POC (Netskope unblock scoped to Artifactory, restricted to Gemma 3n E2B/E4B) under the in-flight ISRA, followed by a generalized self-service pipeline (separate ISRA + ATG submission) with a registry-gated model allowlist."

