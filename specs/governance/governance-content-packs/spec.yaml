component: governance-content-packs
title: "Governance Content Packs \u2014 CMRM/GbD Content as Versioned Configuration"
description: The Sun Life pipeline that turns governance content authored by CMRM
  and Governance-by-Design (the GenAI Model Risk Classification Field Guide, the 40
  MBCT validation obligations across 9 domains, the GenAI Evaluation Metric Selection
  Guide, and the band-to-Model-Risk-tier map) into versioned, schema- validated configuration
  that Luminate loads as seed data. Authors keep Confluence and Excel; ACP Product
  owns conversion, schema validation and release. Everything ships as a numbered content
  pack so an approval can record exactly which questionnaire, obligation set and thresholds
  it was judged against. Resolves the "who maintains this artifact" question consistently
  across the risk-classification module, the obligation registry, per-band validation
  gates and the evaluation metric guide.
