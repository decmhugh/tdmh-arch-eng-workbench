component: governance-intake
title: "Governance Intake & Risk Classification (Sun Life) \u2014 Product Spec"
description: 'Sun Life product-team spec for the governance intake + risk-classification
  process on the Luminate stack: an AI-assisted intake (Amazon Quick) that runs the
  reusable risk-triage engine (consortium governance-risk-triage) seeded with CMRM''s
  GenAI Model Risk Classification Field Guide, maps the resulting risk band to Sun
  Life Model Risk tiers, binds validation requirements and required evaluations per
  band (CMRM policies + evaluation metric guide), routes PIA/ISRA/ATG to ServiceNow,
  syncs Archer as GRC system-of-record, and drives the Luminate Agent/Model/MCP registry
  lifecycle and gated deployments. Consumes the generic consortium engines; all Sun
  Life specifics (Field Guide, sub-codes, OSFI frequencies, Archer/ServiceNow) are
  configured here, not forked upstream. Supersedes the legacy internal governance-integration
  (EACPP-21) for the Luminate go-forward.'
