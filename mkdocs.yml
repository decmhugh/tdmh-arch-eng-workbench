site_name: ACP Specs — Spec-Driven Development
site_description: Component-level specifications for the Enterprise Agentic Control Plane
site_author: EDAE ACP Team
repo_url: https://bitbucket.sunlifecorp.com/projects/EDAEACP/repos/acp-product-specs
repo_name: acp-product-specs
remote_branch: bb-pages

docs_dir: mkdocs-content

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    logo: material/shield-check

