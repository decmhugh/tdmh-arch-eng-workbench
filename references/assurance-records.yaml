# Sun Life assurance records raised for the Agentic Control Plane.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR THE REGISTER.
# docs/assurance-records.md is generated from it — never hand-edit that file.
#
#     python3 scripts/generate_assurance_register.py           # rebuild the page
#     python3 scripts/generate_assurance_register.py --check   # CI: no-op + sweep
#
# Three record types, three ServiceNow tables:
#   atg   ATG000nnnn   architecture governance   x_sulfc_atg_request
#   isra  nn-nnnn       security risk assessment x_sulfc_vendor_ass_vendor_assessment
#   gbyd  GBYDnnnnnnn   GenAI assessment         x_sulfc_genai_gen_ai
#
# --check also sweeps specs/ and docs/ for any identifier of those shapes that is not
# declared below, and fails. That is the point of the file: a record raised in ServiceNow
# and mentioned in one spec header stops being invisible to everyone else.
#
# ServiceNow is the system of record for the state of any of them. Nothing here queries it —
# `state` is what this repository and Jira can evidence, and every row says where that
# evidence came from.

states:
  approved: Governance has granted approval. The scope in `covers` is the approved scope.
  in-review: Submitted; awaiting a decision.
  drafting: A record number has been issued and the submission content is being written.
  planned: A record is known to be needed; nothing has been raised yet.

# Every record needs a `covers`. Where one is genuinely not known, set `covers: ~` and give
# `source` — how we know the number exists at all. The generator lists those rows in a
# "Needs confirming" block at the top of the page rather than letting an unscoped record sit
# in the table looking as settled as the rest.

